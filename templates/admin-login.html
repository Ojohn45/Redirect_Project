<!DOCTYPE html>
<html>
<head>
    <title>Admin Log In - Redirect</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-image">
            <div class="brand-showcase">
                <div class="brand-glow"></div>
                <div class="brand-logo">
                    <span style="--i:1">R</span>
                    <span style="--i:2">e</span>
                    <span style="--i:3">d</span>
                    <span style="--i:4">i</span>
                    <span style="--i:5">r</span>
                    <span style="--i:6">e</span>
                    <span style="--i:7">c</span>
                    <span style="--i:8">t</span>
                </div>
                <div class="brand-line"></div>
                <p class="brand-tagline">Track your learning journey</p>
            </div>
        </div>
        <div class="auth-form-side">
            <div class="auth-box">
                <h1>Admin Log In 🛡️</h1>
                <p class="auth-subtext">Admins only. Please enter your admin details.</p>

                {{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}

                <form method="POST" action="/admin/login">
                    <label>Username</label>
                    <input type="text" name="username" value="{{.Username}}" autocomplete="username" required>

                    <label>Password</label>
                    <input type="password" name="password" autocomplete="current-password" required>

                    <button type="submit" class="btn-filled full-width">Log In as Admin</button>
                </form>

                <p class="auth-switch">
                    Not an admin? <a href="/login">Go to the normal log in</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
