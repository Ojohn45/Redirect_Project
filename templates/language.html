<!DOCTYPE html>
<html>
<head>
    <title>{{.Lang.Name}} - Redirect</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="wide">
    {{template "topbar" .}}

    <p><a href="/languages">← All languages</a></p>
    <h1 class="center">Learn {{.Lang.Name}}</h1>
    <p class="center">{{len .Lang.Resources}} great places to start - click any one:</p>

    <div class="box-grid">
        {{range .Lang.Resources}}
        <a class="site-box" href="/go/{{$.Lang.Slug}}/{{.ID}}" title="{{.Description}}">
            <strong>{{.Name}}</strong>
            <span>{{.Description}}</span>
        </a>
        {{end}}
    </div>
</body>
</html>
