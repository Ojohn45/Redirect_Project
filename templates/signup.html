<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Redirect</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
    <div class="auth-wrapper reverse">
        <div class="auth-form-side">
            <div class="auth-box">
                <h1>Create Your Account</h1>
                <p class="auth-subtext">Join Redirect and start tracking your learning.</p>

                <form method="POST" action="/signup">
                    <label>Full Name</label>
                    <input type="text" name="full_name" required>

                    <label>Username</label>
                    <input type="text" name="username" required>

                    <label>Password</label>
                    <input type="password" name="password" required>
                    <p class="field-hint">Must contain both letters and numbers</p>

                    <button type="submit" class="btn-filled full-width">Sign Up</button>
                </form>

                <p class="auth-switch">
                    Already have an account? <a href="/login">Log in here</a>
                </p>
            </div>
        </div>
        <div class="auth-image">
            <div class="brand-showcase">
                <div class="brand-glow"></div>
                <div class="brand-logo">
                    <span style="--i:1">R</span>
                    <span style="--i:2">e</span>
                    <span style="--i:3">d</span>
                    <span style="--i:4">i</span>
                    <span style="--i:5">r</span>
                    <span style="--i:6">e</span>
                    <span style="--i:7">c</span>
                    <span style="--i:8">t</span>
                </div>
                <div class="brand-line"></div>
                <p class="brand-tagline">Track your learning journey</p>
            </div>
        </div>
    </div>
</body>
</html>
